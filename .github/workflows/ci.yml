name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Kurulum
        run: npm ci

      - name: Tip kontrolü
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format kontrolü
        run: npm run format:check

      - name: Testler
        run: npm run test

      - name: Derleme
        run: npm run build

  e2e:
    name: Uçtan uca · chromium · firefox · webkit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Kurulum
        run: npm ci

      - name: Playwright tarayıcılarını kur
        run: npx playwright install --with-deps chromium firefox webkit

      # webServer komutu zaten `npm run build` çalıştırıyor.
      - name: Uçtan uca testler
        run: npm run test:e2e

      - name: Test raporunu yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
